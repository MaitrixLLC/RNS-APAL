[project]
name = "rns-pypal"
version = "0.0.1"
description = "A careful Python port of the RNS-APAL residue number system library."
readme = "RNS-PYPAL.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]
explore = [
    "ipython",
    "ipykernel",
    "jupyterlab",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"
